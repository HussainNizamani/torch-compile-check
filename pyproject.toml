# Build backend: hatchling.
#
# Reason for the choice, so it is not re-litigated: hatchling reads PEP 621
# metadata natively, supports the src/ layout with no shim files (no setup.py,
# no setup.cfg, no MANIFEST.in), ships `py.typed` and package data without an
# include manifest, and pins its own behaviour by version. setuptools would
# work too; it would cost three extra files and a moving target of deprecation
# warnings around the license fields.
[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "torch-compile-check"
# Kept in step with torch_compile_check.__version__; tests/test_cli.py fails if the
# two drift apart. The tag, the PyPI upload, and the Marketplace listing are
# the maintainer's own step and are written out in docs/release.md -- this
# number moving is what makes them possible, not a claim that they happened.
version = "0.1.0"
description = "Differential testing for torch.compile: does compiling your model change its answers?"
readme = "README.md"
requires-python = ">=3.10"
# PEP 639: an SPDX expression plus the file, rather than the deprecated
# `{text = "MIT"}` table and a `License ::` classifier, which is why there is
# no such classifier below. hatchling 1.32 writes it as
# `License-Expression: MIT` in Metadata-Version 2.5, and `twine check` passes;
# if an index or an older pip ever refuses that, M4-notes records
# `license = {text = "MIT"}` with the classifier added back as the fallback.
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Hussain Nizamani", email = "nizamanihussain@gmail.com" },
]
keywords = [
  "pytorch",
  "torch",
  "torch.compile",
  "inductor",
  "testing",
  "differential-testing",
  "regression-testing",
  "ci",
]
classifiers = [
  # 3 - Alpha and not 4 - Beta: five oracles, a corpus, and a validation set
  # against real models, but 0.1.0 is the first release anyone outside this
  # repository has run.
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Software Development :: Testing",
  "Typing :: Typed",
]
# PLAN.md "Engineering decisions": pure Python, torch is the only runtime
# dependency, argument parsing is stdlib argparse.
dependencies = ["torch>=2.4"]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
  "mypy>=1.11",
  "pre-commit>=3.7",
  # Not a runtime dependency: PLAN.md "Engineering decisions" keeps numpy
  # optional. It is in the dev extra because torch warns "Failed to initialize
  # NumPy" on every import without it, which pollutes the output of every test
  # and every hand run, and because the runner seeds numpy's generator when it
  # is present (PLAN.md "Runner semantics"), a path that is only exercised in
  # CI if numpy is installed there.
  "numpy",
  # The release step of docs/release.md: `python -m build` then
  # `twine check dist/*`. Both are dev tooling and neither is imported by the
  # package, which is why they are here and not in a fourth extra.
  "build>=1.2",
  "twine>=6.1",
]
# What `validation/run.py` needs to build its targets, and nothing the tool
# itself imports: PLAN.md "Engineering decisions" keeps torch the only runtime
# dependency (docs/validation.md "Extras"). transformers is pinned below 5
# because 5.x moved `from transformers import BertModel` behind a lazy import
# that raises ModuleNotFoundError, which is what made hf_tiny_bert unrunnable
# on the M4-2 estate run. torchvision has no pin here and a hard rule instead:
# it must come from the same index as torch, or its compiled ops do not load
# (docs/cross-arch.md).
validation = [
  "torchvision",
  "transformers<5",
]

[project.scripts]
torch-compile-check = "torch_compile_check.cli:main"

[project.urls]
Homepage = "https://github.com/HussainNizamani/torch-compile-check"
Repository = "https://github.com/HussainNizamani/torch-compile-check"
Documentation = "https://github.com/HussainNizamani/torch-compile-check/blob/main/docs/README.md"
Issues = "https://github.com/HussainNizamani/torch-compile-check/issues"
Changelog = "https://github.com/HussainNizamani/torch-compile-check/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/torch_compile_check"]

# Without an explicit include list, hatchling's sdist builder bundles every
# untracked, non-gitignored file sitting in the working tree at build time --
# a stray results/, dp.json or rc.md left over from a hand run lands in
# dist/*.tar.gz right along with the source, found on the aarch64 release
# candidate leg. Pinning the sdist to exactly what a release needs -- source,
# tests, the corpus, the validation suite, docs, the Action, CI, and the
# top-level project files -- makes the sdist reproducible from a clean clone
# regardless of what else happens to be lying around the checkout that built
# it.
[tool.hatch.build.targets.sdist]
include = [
  "src/torch_compile_check/**",
  "tests/**",
  "cases/**",
  "validation/**",
  "docs/**",
  "action/**",
  ".github/workflows/**",
  "PLAN.md",
  "CHANGELOG.md",
  "CONTRIBUTING.md",
  "FINDINGS.md",
  "README.md",
  "LICENSE",
  "Makefile",
  "pyproject.toml",
  ".pre-commit-config.yaml",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "A",    # builtin shadowing
  "B",    # bugbear
  "C4",   # comprehensions
  "E",    # pycodestyle errors
  "F",    # pyflakes
  "I",    # import sorting
  "N",    # pep8-naming
  "PT",   # pytest style
  "PTH",  # pathlib over os.path
  "RET",  # return style
  "RUF",  # ruff rules
  "SIM",  # simplify
  "T20",  # no print
  "UP",   # pyupgrade
  "W",    # pycodestyle warnings
]

# PLAN.md and the M0 brief: no `print` outside cli.py and report/.
[tool.ruff.lint.per-file-ignores]
"src/torch_compile_check/cli.py" = ["T20"]
"src/torch_compile_check/report/*.py" = ["T20"]
"tests/*.py" = ["T20"]
"cases/*.py" = ["T20"]
"validation/*.py" = ["T20"]

[tool.ruff.lint.isort]
# `cases` is not installed and not importable from anywhere but the repository
# root, which is exactly why it has to be named here: without it isort files
# `from cases.markers import ...` as a third-party package and sorts the corpus
# imports away from the ones beside them. tests/conftest.py is what puts the
# root on sys.path.
known-first-party = ["cases", "torch_compile_check", "validation"]

[tool.mypy]
# PLAN.md "Engineering decisions": mypy strict over the package, not over tests
# or cases.
files = ["src"]
python_version = "3.10"
strict = true
warn_unreachable = true
pretty = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
