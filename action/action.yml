name: "compile-check"
description: >-
  Differential testing for torch.compile in CI: run your model's declared
  entrypoints under eager and every compiled backend, catch the numerics,
  aliasing, metadata, and gradient bugs compilation can silently introduce,
  and fail the job on the categories you choose. Installs compile-check,
  runs it against the targets you list, writes a job-summary row per target
  with its stage verdict, and uploads the JSON results. See docs/action.md
  for the full inputs/outputs reference.
author: "HussainNizamani"

branding:
  icon: "check-circle"
  color: "blue"

# PLAN.md "GitHub Action": a composite action published from action/. Inputs
# and outputs mirror the compile-check CLI surface (src/compile_check/cli.py)
# one to one, so the mapping never needs its own separate documentation.
inputs:
  targets:
    description: >-
      Newline-separated list of targets to check, each
      "path[:entry][:inputs]" (PLAN.md "Discovery convention"). Required:
      at least one target.
    required: true
  backends:
    description: >-
      Comma-separated backends to run, forwarded to --backends.
    required: false
    default: "eager,aot_eager,inductor"
  fail-on:
    description: >-
      Comma-separated oracle categories that turn a finding into a failing
      step, forwarded to --fail-on.
    required: false
    default: "numerics,alias,metadata,grad"
  torch:
    description: >-
      Which torch build to install: "stable" (PyPI), "nightly" (CPU
      nightly index), or an explicit pip requirement spec (e.g.
      "torch==2.5.0").
    required: false
    default: "stable"
  python-version:
    description: "Python version for actions/setup-python."
    required: false
    default: "3.12"
  baseline:
    description: >-
      Path to a stored graph-health baseline JSON. When set, forwarded as
      --baseline so the graph oracle fails on new breaks only (PLAN.md
      "GitHub Action").
    required: false
    default: ""
  write-baseline:
    description: >-
      Path to write this run's graph health to, forwarded as
      --write-baseline. For the one-off job that produces the file you then
      commit and pass back as `baseline`; the run itself is unaffected and
      still reports its own verdict.
    required: false
    default: ""
  minimize:
    description: >-
      "true" to pass --minimize, so a finding is shrunk (leading input
      dimension halved, child modules replaced with a passthrough) before it
      is reported. Default "false": the pass costs one re-run per candidate,
      and it is `budget` that bounds it.
    required: false
    default: "false"
  budget:
    description: >-
      Wall-clock ceiling in seconds for the minimizer, forwarded to --budget.
      It bounds what `minimize` starts and nothing else (PLAN.md "GitHub
      Action"), so without minimize: true it has nothing to bound.
    required: false
    default: ""
  cache:
    description: >-
      "true" to let the run reuse compiled artifacts: torch's compile caches
      stay on (the CLI's --allow-caches, so TORCHINDUCTOR_FORCE_DISABLE_CACHES
      is not set) and the pip wheel cache is restored and saved with
      actions/cache, keyed on the torch spec and the Python version. Default
      "false", which is what makes a run measure the current compiler rather
      than an artifact an earlier commit left behind.
    required: false
    default: "false"
  json-out:
    description: >-
      Path to write the combined JSON results to. Also exposed as the
      json-path output.
    required: false
    default: "compile-check-results.json"
  extra-args:
    description: "Extra arguments appended verbatim to every invocation."
    required: false
    default: ""
  ref:
    description: >-
      Git ref of HussainNizamani/compile-check to install from, until the
      package is on PyPI.
    required: false
    default: "main"
  source:
    description: >-
      Where to install compile-check from: "auto" (default) installs from
      the checked-out source when the action runs inside this repo (its
      parent directory has a pyproject.toml declaring compile-check), else
      falls back to "git"; "local" forces the checked-out-source install
      (`pip install $GITHUB_ACTION_PATH/..`); "git" forces
      `pip install git+https://github.com/HussainNizamani/compile-check@ref`
      (needed by external consumers once the repo is public or the package
      is on PyPI, since pip cannot clone a private repo without
      credentials).
    required: false
    default: "auto"
  allow-unimplemented:
    description: >-
      Backward compatibility for a `ref` pinned to a commit before M1-3
      (PR #6): on such a ref, the CLI's main run path is not implemented
      and exits 2 with a fixed "not implemented" message for any real
      target. When true, that specific exit is treated as neutral (the
      step does not fail) instead of an error, so a workflow pinned to a
      pre-M1-3 `ref` does not red every job in a consuming repository. A
      `ref` at or after M1-3 (including the default, `main`) never takes
      this path -- `compile-check <target>` runs for real and exits 0, 1,
      or 2 on its own terms. Default false: an unimplemented run is a real
      failure, since a green job that checked nothing is worse than a red
      one that says so.
    required: false
    default: "false"

outputs:
  exit-code:
    description: >-
      The worst exit code across all targets (0 clean, 1 finding, 2 tool
      error; see src/compile_check/cli.py exit codes).
    value: ${{ steps.run.outputs.exit-code }}
  json-path:
    description: "Path to the combined JSON results file."
    value: ${{ steps.run.outputs.json-path }}

runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    # actions/cache wants a key it can use verbatim, and `torch` is a pip
    # requirement spec that can carry "==", "<", "!" and spaces. Slug it here
    # rather than interpolating it raw, so `torch: "torch==2.5.0"` and
    # `torch: stable` both produce a usable key.
    - name: Compute the wheel cache key
      id: cache-key
      if: inputs.cache == 'true'
      shell: bash
      env:
        TORCH: ${{ inputs.torch }}
        PYTHON_VERSION: ${{ inputs.python-version }}
        OS: ${{ runner.os }}
        ARCH: ${{ runner.arch }}
      run: |
        set -euo pipefail
        slug() { printf '%s' "$1" | tr -c '[:alnum:]._-' '-'; }
        prefix="compile-check-pip-$(slug "$OS")-$(slug "$ARCH")-py$(slug "$PYTHON_VERSION")-"
        {
          echo "prefix=${prefix}"
          echo "key=${prefix}torch-$(slug "$TORCH")"
        } >>"$GITHUB_OUTPUT"

    # Only pip's download cache: the wheels, not a virtualenv. torch is the
    # expensive part of every job here, and re-resolving it against the index
    # on a hit is cheap next to fetching a 200 MB wheel again. The key carries
    # the torch spec, so `torch: nightly` -- whose resolved version moves daily
    # -- keeps hitting the same entry and simply downloads the wheel that is not
    # in it; the prefix restore-key is what keeps a changed spec partly warm.
    - name: Restore the pip wheel cache
      if: inputs.cache == 'true'
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ steps.cache-key.outputs.key }}
        restore-keys: |
          ${{ steps.cache-key.outputs.prefix }}

    - name: Install torch
      shell: bash
      run: |
        set -euo pipefail
        case "${{ inputs.torch }}" in
          stable)
            python -m pip install --upgrade pip
            python -m pip install "torch>=2.4" \
              --index-url https://download.pytorch.org/whl/cpu
            ;;
          nightly)
            python -m pip install --upgrade pip
            python -m pip install --pre torch \
              --index-url https://download.pytorch.org/whl/nightly/cpu
            ;;
          *)
            python -m pip install --upgrade pip
            python -m pip install "${{ inputs.torch }}"
            ;;
        esac

    - name: Install compile-check
      shell: bash
      env:
        SOURCE: ${{ inputs.source }}
        REF: ${{ inputs.ref }}
      run: |
        set -euo pipefail

        repo_root="$GITHUB_ACTION_PATH/.."
        mode="$SOURCE"
        if [ "$mode" = "auto" ]; then
          if [ -f "$repo_root/pyproject.toml" ] \
            && grep -q 'name = "compile-check"' "$repo_root/pyproject.toml"; then
            mode="local"
          else
            mode="git"
          fi
        fi

        case "$mode" in
          local)
            python -m pip install "$repo_root"
            ;;
          git)
            python -m pip install "git+https://github.com/HussainNizamani/compile-check@${REF}"
            ;;
          *)
            echo "::error::Unknown source '$SOURCE' (expected auto, local, or git)" >&2
            exit 1
            ;;
        esac

    - name: Run compile-check
      id: run
      shell: bash
      # PLAN.md "GitHub Action": disable compile caches by default so a run
      # measures the current compiler (cache: true opts out); loop over
      # targets, collect the worst exit code, write a job summary row per
      # target through summary.sh -- exit code, graph-break count, stage, and
      # a minimized block under the table when --minimize ran -- and degrade
      # honestly on a pre-M1-3 ref, where the CLI main path is not implemented
      # yet (see the allow-unimplemented input; main is past M1-3 already).
      env:
        TARGETS: ${{ inputs.targets }}
        BACKENDS: ${{ inputs.backends }}
        FAIL_ON: ${{ inputs.fail-on }}
        BASELINE: ${{ inputs.baseline }}
        WRITE_BASELINE: ${{ inputs.write-baseline }}
        MINIMIZE: ${{ inputs.minimize }}
        BUDGET: ${{ inputs.budget }}
        CACHE: ${{ inputs.cache }}
        JSON_OUT: ${{ inputs.json-out }}
        EXTRA_ARGS: ${{ inputs.extra-args }}
        ALLOW_UNIMPLEMENTED: ${{ inputs.allow-unimplemented }}
      run: |
        set -uo pipefail

        # The three boolean inputs are compared against the string "true", so
        # anything else is off. Reject a third value rather than silently
        # reading it as false: `cache: yes` quietly measuring the wrong thing
        # for a month is exactly the failure this tool exists to complain about.
        for pair in "minimize=$MINIMIZE" "cache=$CACHE" "allow-unimplemented=$ALLOW_UNIMPLEMENTED"; do
          case "${pair#*=}" in
            true | false) ;;
            *)
              echo "::error::input ${pair%%=*} must be \"true\" or \"false\", got \"${pair#*=}\"" >&2
              exit 2
              ;;
          esac
        done

        # One baseline file cannot hold two targets' graph health: it is keyed
        # by backend, not by target (docs/action.md "Baseline semantics"). So a
        # write-baseline run takes exactly one target, instead of letting the
        # last target silently overwrite what the others wrote.
        if [ -n "$WRITE_BASELINE" ] \
          && [ "$(printf '%s\n' "$TARGETS" | grep -c '[^[:space:]]')" -gt 1 ]; then
          echo "::error::write-baseline takes a single target, since one baseline file is keyed by backend and not by target" >&2
          exit 2
        fi

        worst=0
        index=0
        version="$(compile-check --version)"
        # Collected during the loop and appended after the table: a <details>
        # block per target that ran the minimizer, which has to come after the
        # rows rather than between two of them.
        minimized_sections="$(mktemp)"

        {
          echo "## compile-check results ($version)"
          echo
          echo "| target | exit code | status | graph breaks | stage |"
          echo "|---|---|---|---|---|"
        } >>"$GITHUB_STEP_SUMMARY"

        while IFS= read -r target; do
          [ -z "$target" ] && continue
          index=$((index + 1))

          target_json="${JSON_OUT%.json}.${index}.json"

          args=(compile-check "$target" --backends "$BACKENDS" --fail-on "$FAIL_ON" --json "$target_json")
          [ -n "$BASELINE" ] && args+=(--baseline "$BASELINE")
          [ -n "$WRITE_BASELINE" ] && args+=(--write-baseline "$WRITE_BASELINE")
          [ "$MINIMIZE" = "true" ] && args+=(--minimize)
          # --budget bounds --minimize and nothing else (PLAN.md "GitHub
          # Action"), so passing it without minimize: true gets one line on
          # stderr from the CLI saying the ceiling had nothing to bound.
          [ -n "$BUDGET" ] && args+=(--budget "$BUDGET")
          # cache: true means "keep torch's compile caches", which is the CLI's
          # --allow-caches; the default leaves the CLI to set
          # TORCHINDUCTOR_FORCE_DISABLE_CACHES=1 so the run measures the current
          # compiler. The report records which mode was in force.
          [ "$CACHE" = "true" ] && args+=(--allow-caches)
          # shellcheck disable=SC2206
          [ -n "$EXTRA_ARGS" ] && args+=($EXTRA_ARGS)

          set +e
          output="$("${args[@]}" 2>&1)"
          code=$?
          set -e

          echo "$output"

          # The stage verdict is the line right after the terminal report's
          # "stage" heading (report/terminal.py): "first diverges at
          # <backend>, ..." or "clean: ...". Absent entirely on a path that
          # never got as far as a comparison (--probe, an unimplemented run,
          # a tool error before discovery), so an empty cell there is
          # accurate, not a parsing miss.
          stage="$(printf '%s\n' "$output" | grep -m1 -E '^[[:space:]]*(first diverges at|clean:)' | sed 's/^[[:space:]]*//')"

          if [ "$code" -eq 2 ] && printf '%s' "$output" | grep -q "not implemented"; then
            status="not implemented on this ref (pre-M1-3; PR #6 implements the main path on main)"
            if [ "$ALLOW_UNIMPLEMENTED" = "true" ]; then
              row_code=0
            else
              row_code=2
              worst=2
            fi
          else
            status="exit $code"
            row_code=$code
            [ "$code" -gt "$worst" ] && worst=$code
          fi

          # The row's graph-break cell and the minimized block are read from
          # the JSON the run just wrote, not from the terminal output: they are
          # structured fields (backends[].graph.break_count and the top-level
          # `minimized` object of schema_version 2) and re-parsing prose for
          # them would be a second, worse copy of the report.
          bash "$GITHUB_ACTION_PATH/summary.sh" \
            row "$target" "$row_code" "$status" "${stage:--}" "$target_json" \
            >>"$GITHUB_STEP_SUMMARY"
          bash "$GITHUB_ACTION_PATH/summary.sh" \
            minimized "$target" "$target_json" >>"$minimized_sections"
        done <<<"$TARGETS"

        if [ -s "$minimized_sections" ]; then
          {
            echo
            echo "### Minimized"
            echo
            cat "$minimized_sections"
          } >>"$GITHUB_STEP_SUMMARY"
        fi
        rm -f "$minimized_sections"

        echo "exit-code=$worst" >>"$GITHUB_OUTPUT"
        echo "json-path=${JSON_OUT}" >>"$GITHUB_OUTPUT"

        exit "$worst"
