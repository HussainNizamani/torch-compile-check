name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: py${{ matrix.python-version }} / torch ${{ matrix.torch }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      # Every cell is a separate question; one red cell must not hide the rest.
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        torch: [stable, nightly]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      # The CPU index, not PyPI: on x86 runners the PyPI wheel is the CUDA build,
      # which pulls roughly two gigabytes of nvidia-* wheels this CPU-only lane
      # never loads. The nightly lane below already points at the CPU index.
      - name: Install torch (stable, CPU wheels)
        if: matrix.torch == 'stable'
        run: |
          python -m pip install "torch>=2.4" \
            --index-url https://download.pytorch.org/whl/cpu

      - name: Install torch (nightly, CPU wheels)
        if: matrix.torch == 'nightly'
        run: |
          python -m pip install --pre torch \
            --index-url https://download.pytorch.org/whl/nightly/cpu

      - name: Install torch-compile-check
        run: python -m pip install -e ".[dev]"

      - name: Record the environment
        run: |
          python -c "import json; from torch_compile_check.env import collect_environment; \
            print(json.dumps(collect_environment(), indent=2))"

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Type
        run: mypy src/

      - name: Test
        run: pytest -q

      # PLAN.md "Regression corpus": which of the known bugs *this* cell's torch
      # still has is the question the matrix exists to answer, and the answer
      # belongs on the job page rather than in a log. cases/summary.py runs each
      # standalone RED/GREEN script and tabulates observed against the version
      # marker in cases/markers.py; the same verdicts go through pytest above,
      # where a disagreement is a warning rather than a failure.
      #
      # `if: always()` because the table is most wanted on the cell that just
      # went red: a nightly that moves an oracle fails the tests and the corpus
      # is how you tell "torch changed" from "the tool broke".
      #
      # Appended rather than written by the module: a module that wrote to
      # $GITHUB_STEP_SUMMARY itself would be untestable anywhere else and silent
      # when the variable is unset, and it costs five scripts' worth of compiles,
      # so it is a step someone can see and time rather than a hidden side effect.
      - name: Corpus RED/GREEN summary
        if: always()
        run: python -m cases.summary >> "$GITHUB_STEP_SUMMARY"

      # PLAN.md "Verified API surface": the private torch APIs the oracles lean
      # on are checked on every cell of the matrix, so a nightly that moves one
      # of them shows up here rather than in a user's run.
      - name: Probe the torch API surface
        run: torch-compile-check --probe

      # The console script end to end on every cell, not only the library: the
      # tool's own claim is "one command", and a packaging or entry-point break
      # would pass every test above.
      - name: Run the tool on the reference fixture
        run: torch-compile-check tests/fixtures/mlp.py
